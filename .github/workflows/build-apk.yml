name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (dart-define)"
        required: false
        default: "http://192.168.1.102:8000"
      build_mode:
        description: "debug or release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure asset dirs
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Pub get
        run: flutter pub get

      - name: Ensure Android embedding v2
        run: |
          if ! grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            rm -rf android
            flutter create . --project-name mport --org id.mandalanet --platforms=android
          fi
          # Flutter 3.47+ requires Gradle >= 8.14
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-[0-9.]*-all.zip/gradle-9.3.1-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          fi
          if ! grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: Android embedding v2 still missing"
            exit 1
          fi
          if ! grep -q 'usesCleartextTraffic' android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml || true
          fi

      - name: Resolve API URL
        id: api
        run: |
          if [ -n "${{ github.event.inputs.api_base_url }}" ]; then
            echo "url=${{ github.event.inputs.api_base_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://api.mandalanet.id" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve build mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.build_mode }}"
          if [ -z "$MODE" ]; then MODE=release; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --${{ steps.mode.outputs.mode }} \
            --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mport-${{ steps.mode.outputs.mode }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

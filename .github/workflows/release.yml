name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 2.0.1)"
        required: false
        default: "2.0.1"
      api_base_url:
        description: "Production API base URL"
        required: false
        default: "https://api.mandalanet.id"

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure asset dirs
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Pub get
        run: flutter pub get

      - name: Verify Android project
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          if ! grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml; then
            echo "ERROR: Android embedding v2 is missing."
            echo "Refusing to recreate android/ because that could overwrite signing configuration."
            exit 1
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-[0-9.]*-all.zip/gradle-9.3.1-all.zip/' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Resolve version & API
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${{ github.event.inputs.version }}"
          fi

          API="${{ github.event.inputs.api_base_url }}"

          if [ -z "$API" ]; then
            API="https://api.mandalanet.id"
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          MPORT_KEYSTORE_BASE64: ${{ secrets.MPORT_KEYSTORE_BASE64 }}
          MPORT_KEYSTORE_PASSWORD: ${{ secrets.MPORT_KEYSTORE_PASSWORD }}
          MPORT_KEY_ALIAS: ${{ secrets.MPORT_KEY_ALIAS }}
          MPORT_KEY_PASSWORD: ${{ secrets.MPORT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$MPORT_KEYSTORE_BASE64"
          test -n "$MPORT_KEYSTORE_PASSWORD"
          test -n "$MPORT_KEY_ALIAS"
          test -n "$MPORT_KEY_PASSWORD"

          printf '%s' "$MPORT_KEYSTORE_BASE64" | base64 --decode > android/app/mport-release.p12

          cat > android/key.properties <<EOF2
          storePassword=$MPORT_KEYSTORE_PASSWORD
          keyPassword=$MPORT_KEY_PASSWORD
          keyAlias=$MPORT_KEY_ALIAS
          storeFile=mport-release.p12
          storeType=PKCS12
          EOF2

          chmod 600 android/key.properties
          chmod 600 android/app/mport-release.p12

          test -s android/app/mport-release.p12
          test -s android/key.properties

      - name: Verify signing configuration
        run: |
          grep -q 'create("release")' android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts
          grep -q 'storeType' android/app/build.gradle.kts

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.meta.outputs.api }}

      - name: Verify APK signature
        run: |
          APK=$(find build/app/outputs/flutter-apk \
            -type f -name "*.apk" | head -1)

          test -n "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -1)

          test -n "$APKSIGNER"

          echo "Verifying APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ steps.meta.outputs.api }}

      - name: Prepare release assets
        run: |
          set -euo pipefail

          mkdir -p dist

          APK=$(find build/app/outputs/flutter-apk \
            -type f -name "*release*.apk" | head -1)

          test -n "$APK"

          cp "$APK" \
            "dist/MPorT-${{ steps.meta.outputs.version }}-release.apk"

          AAB=$(find build/app/outputs/bundle/release \
            -type f -name "*.aab" | head -1 || true)

          if [ -n "$AAB" ]; then
            cp "$AAB" \
              "dist/MPorT-${{ steps.meta.outputs.version }}-release.aab"
          fi

          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mport-release-${{ steps.meta.outputs.version }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MPorT ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/mport-release.p12

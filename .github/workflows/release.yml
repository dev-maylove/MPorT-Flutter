name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 2.0.1)"
        required: false
        default: "2.0.1"
      api_base_url:
        description: "Production API base URL"
        required: false
        default: "https://api.mandalanet.id"

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure asset dirs
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Pub get
        run: flutter pub get

      - name: Ensure Android embedding v2
        run: |
          if ! grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            rm -rf android
            flutter create . --project-name mport --org id.mandalanet --platforms=android
          fi
          # Flutter 3.47+ requires Gradle >= 8.14
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-[0-9.]*-all.zip/gradle-9.3.1-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Resolve version & API
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${{ github.event.inputs.version }}"
          fi
          API="${{ github.event.inputs.api_base_url }}"
          if [ -z "$API" ]; then API="https://api.mandalanet.id"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.meta.outputs.api }}

      - name: Build App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ steps.meta.outputs.api }}
        continue-on-error: true

      - name: Prepare release assets
        run: |
          mkdir -p dist
          APK=$(ls build/app/outputs/flutter-apk/*release*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          fi
          cp "$APK" "dist/MPorT-${{ steps.meta.outputs.version }}-release.apk"
          AAB=$(ls build/app/outputs/bundle/release/*.aab 2>/dev/null | head -1 || true)
          if [ -n "$AAB" ]; then
            cp "$AAB" "dist/MPorT-${{ steps.meta.outputs.version }}-release.aab"
          fi
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mport-release-${{ steps.meta.outputs.version }}
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MPorT ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
